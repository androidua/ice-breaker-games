<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="party-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4f1ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eee6d7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#party-grad)" />
  
  <!-- Fun Shapes -->
  <circle cx="1400" cy="100" r="150" fill="#3d5a80" opacity="0.1" />
  <circle cx="200" cy="300" r="120" fill="#c04b3a" opacity="0.1" />
  <rect x="1200" y="250" width="100" height="100" fill="#5a7d3a" opacity="0.1" transform="rotate(15, 1250, 300)" />
  
  <!-- Logo 1 (Grid) Motif -->
  <g transform="translate(700, 60) scale(0.6)">
    <rect x="0" y="0" width="70" height="70" fill="#c04b3a" rx="4" />
    <rect x="80" y="0" width="70" height="70" fill="#5a7d3a" rx="4" />
    <rect x="0" y="80" width="70" height="70" fill="#3d5a80" rx="4" />
    <rect x="80" y="80" width="70" height="70" fill="#2a2a2a" rx="4" />
    <circle cx="75" cy="75" r="12" fill="#f4f1ea" />
  </g>
  
  <!-- Center Text -->
  <g transform="translate(800, 240)">
    <text font-family="'Courier New', Courier, monospace" font-size="120" font-weight="900" fill="#2a2a2a" letter-spacing="20" text-anchor="middle">HUDDLE</text>
    <text y="70" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="700" fill="#2a2a2a" letter-spacing="12" text-anchor="middle" opacity="0.7">ONE LINK • ZERO FRICTION</text>
    <text y="120" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" fill="#3d5a80" letter-spacing="6" text-anchor="middle">8 PLAYERS • ALL DEVICES • INSTANT PLAY</text>
  </g>
</svg>
