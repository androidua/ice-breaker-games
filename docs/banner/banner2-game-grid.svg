<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="400" fill="#2a2a2a" />
  
  <!-- Icon Grid Background -->
  <g opacity="0.15">
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" stroke="#f4f1ea" stroke-width="0.5" />
    </pattern>
    <rect width="1600" height="400" fill="url(#grid)" />
  </g>
  
  <!-- Game Icons Layout -->
  <g transform="translate(800, 200)">
    <!-- Main Text -->
    <text font-family="'Courier New', Courier, monospace" font-size="96" font-weight="900" fill="#f4f1ea" letter-spacing="16" text-anchor="middle">HUDDLE</text>
    <text y="60" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#5a7d3a" letter-spacing="10" text-anchor="middle">LEVEL UP YOUR MEETINGS</text>
    
    <!-- Game Icons (Floating) -->
    <!-- Bomber -->
    <g transform="translate(-450, -60) scale(0.5)">
      <circle cx="50" cy="50" r="40" fill="#c04b3a" />
      <rect x="40" y="0" width="20" height="20" fill="#333" />
    </g>
    <!-- Trivia -->
    <g transform="translate(380, -70) scale(0.6)">
      <text font-family="'Courier New', Courier, monospace" font-size="80" fill="#3d5a80" font-weight="bold">?</text>
    </g>
    <!-- Sketch -->
    <g transform="translate(-400, 70) scale(0.5)">
      <path d="M10 90 L90 10 L100 0 L110 10 L10 110 Z" fill="#5a7d3a" />
    </g>
    <!-- Snake -->
    <g transform="translate(420, 80) scale(0.5)">
      <path d="M0 50 H40 V10 H80 V50 H120" stroke="#f4f1ea" stroke-width="12" fill="none" />
    </g>
  </g>
  
  <!-- Bottom Accent -->
  <rect y="380" width="1600" height="20" fill="#c04b3a" />
</svg>
