<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="400" fill="#f4f1ea" />
  
  <!-- Logo 3 Motif background -->
  <g transform="translate(1300, 50) scale(1.5)" opacity="0.05">
    <rect width="140" height="100" fill="#2a2a2a" rx="4" />
    <path d="M60 20 L100 50 L60 80 Z" fill="#f4f1ea" />
  </g>
  
  <g transform="translate(100, 150)">
    <text font-family="'Courier New', Courier, monospace" font-size="80" font-weight="900" fill="#2a2a2a" letter-spacing="8">HUDDLE PLAY</text>
    <text y="70" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#3d5a80" letter-spacing="4">CURATED ICE BREAKER GAMES</text>
  </g>
  
  <!-- Game Strip -->
  <g transform="translate(100, 280)">
    <g transform="translate(0,0)">
       <rect width="180" height="40" fill="#c04b3a" rx="4" />
       <text x="90" y="26" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#f4f1ea" text-anchor="middle">BOMBER</text>
    </g>
    <g transform="translate(200,0)">
       <rect width="180" height="40" fill="#3d5a80" rx="4" />
       <text x="90" y="26" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#f4f1ea" text-anchor="middle">TRIVIA</text>
    </g>
    <g transform="translate(400,0)">
       <rect width="180" height="40" fill="#5a7d3a" rx="4" />
       <text x="90" y="26" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#f4f1ea" text-anchor="middle">SKETCH</text>
    </g>
    <g transform="translate(600,0)">
       <rect width="180" height="40" fill="#2a2a2a" rx="4" />
       <text x="90" y="26" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#f4f1ea" text-anchor="middle">TYPERACER</text>
    </g>
    <g transform="translate(800,0)">
       <rect width="180" height="40" fill="#b6a88f" rx="4" />
       <text x="90" y="26" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#141414" text-anchor="middle">WORD CHAIN</text>
    </g>
  </g>
  
  <!-- Right Side Accent -->
  <rect x="1550" width="50" height="400" fill="#3d5a80" />
</svg>
